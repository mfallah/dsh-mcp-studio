<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     role="img" aria-labelledby="title desc" font-family="Tahoma, 'Segoe UI', 'Vazirmatn', sans-serif">
  <title id="title">نمای شماتیک پنل استودیوی MCP</title>
  <desc id="desc">A schematic drawing of the MCP Studio panel: a sidebar icon, a header, two tabs,
    a catalog search box and four catalog rows with an install button.</desc>

  <rect width="880" height="520" fill="#111318"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="880" height="34" fill="#1a1d24"/>
  <circle cx="20" cy="17" r="5" fill="#3a3f4b"/>
  <circle cx="38" cy="17" r="5" fill="#3a3f4b"/>
  <circle cx="56" cy="17" r="5" fill="#3a3f4b"/>
  <text x="820" y="21" fill="#6b7280" font-size="12" direction="ltr">127.0.0.1:3080</text>

  <!-- sidebar -->
  <rect x="0" y="34" width="64" height="486" fill="#15181e"/>
  <rect x="8" y="52" width="48" height="36" rx="8" fill="#2b6cb0"/>
  <text x="32" y="76" fill="#ffffff" font-size="16" text-anchor="middle">M</text>
  <rect x="8" y="100" width="48" height="36" rx="8" fill="#1e222a"/>
  <rect x="8" y="148" width="48" height="36" rx="8" fill="#1e222a"/>
  <rect x="8" y="196" width="48" height="36" rx="8" fill="#1e222a"/>

  <!-- main panel -->
  <g direction="rtl">
    <!-- header -->
    <text x="848" y="82" fill="#f3f4f6" font-size="24" font-weight="bold" text-anchor="end">استودیوی MCP</text>
    <text x="848" y="106" fill="#9ca3af" font-size="13" text-anchor="end">سرورهای MCP را ببین، نصب کن، وصل شو و مدیریت کن — بدون دست‌زدن به YAML.</text>

    <!-- tabs -->
    <rect x="748" y="124" width="100" height="30" rx="15" fill="#2b6cb0"/>
    <text x="798" y="144" fill="#ffffff" font-size="13" text-anchor="middle">کاتالوگ</text>
    <rect x="640" y="124" width="100" height="30" rx="15" fill="#1e222a"/>
    <text x="690" y="144" fill="#cbd5e1" font-size="13" text-anchor="middle">نصب‌شده‌ها</text>
    <rect x="84" y="124" width="120" height="30" rx="8" fill="#1e222a"/>
    <text x="144" y="144" fill="#9ca3af" font-size="12" text-anchor="middle">برون‌ریزی patch</text>

    <!-- search -->
    <rect x="470" y="168" width="378" height="32" rx="8" fill="#1a1d24" stroke="#2a2f39"/>
    <text x="832" y="189" fill="#6b7280" font-size="12" text-anchor="end">جست‌وجو بر پایهٔ نام، سازنده یا برچسب…</text>

    <!-- catalog rows -->
    <g>
      <rect x="84" y="216" width="764" height="58" rx="10" fill="#171a21" stroke="#242a34"/>
      <text x="832" y="240" fill="#e5e7eb" font-size="14" text-anchor="end">Filesystem</text>
      <text x="832" y="260" fill="#8b93a1" font-size="11" text-anchor="end">دسترسی کنترل‌شده به پوشه‌های مجاز — stdio</text>
      <rect x="100" y="232" width="72" height="26" rx="6" fill="#2f855a"/>
      <text x="136" y="250" fill="#ffffff" font-size="12" text-anchor="middle">نصب</text>
      <rect x="180" y="232" width="86" height="26" rx="13" fill="#1f2937"/>
      <text x="223" y="250" fill="#93c5fd" font-size="11" text-anchor="middle">بدون اینترنت</text>
    </g>
    <g>
      <rect x="84" y="284" width="764" height="58" rx="10" fill="#171a21" stroke="#242a34"/>
      <text x="832" y="308" fill="#e5e7eb" font-size="14" text-anchor="end">GitHub</text>
      <text x="832" y="328" fill="#8b93a1" font-size="11" text-anchor="end">مخزن، issue و PR — نیازمند توکن</text>
      <rect x="100" y="300" width="72" height="26" rx="6" fill="#2f855a"/>
      <text x="136" y="318" fill="#ffffff" font-size="12" text-anchor="middle">نصب</text>
      <rect x="180" y="300" width="110" height="26" rx="13" fill="#3b2a12"/>
      <text x="235" y="318" fill="#fbbf24" font-size="11" text-anchor="middle">۱ ورودی لازم</text>
    </g>
    <g>
      <rect x="84" y="352" width="764" height="58" rx="10" fill="#171a21" stroke="#242a34"/>
      <text x="832" y="376" fill="#e5e7eb" font-size="14" text-anchor="end">Postgres</text>
      <text x="832" y="396" fill="#8b93a1" font-size="11" text-anchor="end">کوئری فقط-خواندنی روی پایگاه‌داده — streamable-http</text>
      <rect x="100" y="368" width="72" height="26" rx="6" fill="#2f855a"/>
      <text x="136" y="386" fill="#ffffff" font-size="12" text-anchor="middle">نصب</text>
      <rect x="180" y="368" width="110" height="26" rx="13" fill="#3b2a12"/>
      <text x="235" y="386" fill="#fbbf24" font-size="11" text-anchor="middle">۱ راز لازم</text>
    </g>
    <g>
      <rect x="84" y="420" width="764" height="58" rx="10" fill="#171a21" stroke="#242a34"/>
      <text x="832" y="444" fill="#e5e7eb" font-size="14" text-anchor="end">Everything (test server)</text>
      <text x="832" y="464" fill="#8b93a1" font-size="11" text-anchor="end">سرور آزمایشی برای دیدن همهٔ انواع محتوا</text>
      <rect x="100" y="436" width="72" height="26" rx="6" fill="#2f855a"/>
      <text x="136" y="454" fill="#ffffff" font-size="12" text-anchor="middle">نصب</text>
    </g>
  </g>

  <text x="440" y="508" fill="#4b5563" font-size="11" text-anchor="middle" direction="ltr">schematic — not a real screenshot</text>
</svg>
